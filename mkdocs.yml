site_name: Optima Prevent
site_url: https://support.optima-prevent.eu
site_author: A1 Informatika d.o.o.
site_description: Dokumentacija in podpora za programsko opremo Optima Prevent (VZD, PV, HRM, CRM)

repo_url: https://github.com/a1info/support
repo_name: a1info/support
edit_uri: edit/main/docs/

theme:
  name: material
  language: sl
  logo: media/logos/op-logo.png
  favicon: media/logos/op-logo-blue.png
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # Svetla tema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Preklopi na temno temo
    # Temna tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Preklopi na svetlo temo
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - navigation.footer

extra_css:
  - assets/index.css

plugins:
  - search

extra:
  alternate:
    - name: Slovenščina
      link: /
      lang: sl
    - name: English
      link: /en/
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Domov: index.md
  - Dokumentacija:
    - Priročnik:
      - Prijava in vmesnik: manual-sl/prijava.md
      - Navigacija: manual-sl/navigacija.md
      - Začetna nastavitev: manual-sl/zacetna-nastavitev.md
      - Stranke in poslovne enote: manual-sl/stranke.md
      - Portal za stranke: manual-sl/portal-za-stranke.md
      - Portal za zdravnike: manual-sl/portal-za-zdravnike.md
      - Zaposleni: manual-sl/zaposleni.md
      - Uporabniki in pravice: manual-sl/uporabniki.md
      - Analitika: manual-sl/analitika.md
      - Usposabljanje: manual-sl/usposabljanje.md
      - Delovna oprema: manual-sl/delovna-oprema.md
      - Evidence: manual-sl/evidence.md
      - VZD / EKO meritve: manual-sl/vzd-eko-meritve.md
      - Ocene tveganj: manual-sl/ocene-tveganj.md
      - Ocene telesnih obremenitev (RASSL): manual-sl/rassl.md
      - Požarna varnost: manual-sl/pozarna-varnost.md
      - HRM - Upravljanje kadrov: manual-sl/hrm.md
      - CRM - Organizacija dela: manual-sl/crm.md
      - ERP - Ponudbe in pogodbe: manual-sl/erp.md
      - Dokumentni tok in potrjevanje: manual-sl/dokumentni-tok.md
      - Sistemske nastavitve: manual-sl/sistemske-nastavitve.md
      - Sinhronizacija med namestitvami: manual-sl/sinhronizacija.md
      - Sistem obveščanja: manual-sl/sistem-obvescanja.md
      - Urejanje predlog: manual-sl/urejanje-podlog.md
      - Legenda spremenljivk: manual-sl/variables-sl.md
  - Pogosta vprašanja (FAQ): faq-sl.md
  - Podpora:
    - Prijavi napako: https://github.com/a1info/support/issues/new?template=bug_report.yml
    - Predlagaj izboljšavo: https://github.com/a1info/support/issues/new?template=feature_request.yml
    - Pogovori (Discussions): https://github.com/a1info/support/discussions
    - Kontakt: mailto:svetovanje@optima-prevent.eu
  - Pogoji uporabe: terms-sl.md